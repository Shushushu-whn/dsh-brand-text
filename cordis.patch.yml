# ================================================================
# dsh-brand-text —— DSH 品牌设置（一体化插件）
#
# 功能分两组，面板与双击弹窗都是这个顺序：
#   ① 基本设置（本职）
#        · 浏览器标题 / favicon / PWA 图标
#        · 左上角 Logo + 左上角文字
#        · 空会话正中间那句标题
#   ② 水印（新功能）
#        · 页面水印：半透明斜向文字叠在 DSH 上，透明度/角度/字号可调
#        · 文件/文件夹贴标：把「为什么加 / 在干什么活」写进项目目录
#          （说明文件 + 资源管理器悬停提示 + 徽标图标）
#
# 设置面板：http://127.0.0.1:<DSH端口>/brand-studio/
#
# install: dsh plugin --profile <profile> add <本目录>
# 想重复安装到另一套 DSH（例如个人版）就换 profile 再跑一次。
# ================================================================
- insert:
    - id: dsh-brand-text
      name: 'dsh-brand-text'
      inject: [webServer]
      # configPath 留空 = 用插件目录下的 brand.json；
      # 各 profile 可在自己的 cordis.patch.yml 里按 id 覆盖成自己的品牌数据文件。
      config:
        configPath: ''

# 关掉官方那条品牌行，品牌位交给本插件（与 dsh-client-ui-brand 同样的做法）
- id: ui-brand-official
  disabled: true
